[project]
name = "adp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=1.13.0",
    "hydra-core>=1.3.2",
    "pillow>=12.2.0",
    "loguru>=0.7.2",
    "numpy>=2.0",
    "scipy>=1.13",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "albumentations>=1.4.18",
    "opencv-python-headless>=4.10.0",
    "pycocotools>=2.0.8",
    "tqdm>=4.66.0",
    "timm>=1.0.26",
    "coremltools>=9.0",
]

[project.scripts]
adp = "adp:main"

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[tool.basedpyright]
typeCheckingMode = "basic"
