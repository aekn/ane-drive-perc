name: "dfine_l_bdd010k"
teacher_type: "dfine"

data:
  config: "configs/data/bdd100k_det_010k.yaml"
  coco_dir: "outputs/teacher_data/bdd100k_coco_010k"
  train_split: "train"
  val_split: "val"

dfine:
  repo_url: "https://github.com/Peterande/D-FINE.git"
  repo_dir: ".cache/third_party/dfine"
  ref: "master"

  model_size: "l"
  base_config: "configs/dfine/custom/objects365/dfine_hgnetv2_l_obj2custom.yml"
  generated_config_dir: "outputs/teacher_configs/dfine_l_bdd010k"

pretrained:
  enabled: true
  url: "https://github.com/Peterande/storage/releases/download/dfinev1.0/dfine_l_obj365_e25.pth"
  local_path: ".cache/teacher_checkpoints/dfine/dfine_l_obj365_e25.pth"

train:
  devices: "0"
  nproc_per_node: 1
  master_port: 7777
  seed: 42
  use_amp: true
  tune_from: null
  output_dir: "runs/teachers/dfine_l_bdd010k"

runtime:
  materialize_train: true
  materialize_val: true
  install_requirements: false
