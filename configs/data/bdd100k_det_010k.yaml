name: bdd100k_det
task: detection
storage: webdataset

hf_repo: "aekn/ane-drive-perc-bdd100k"
hf_repo_type: "dataset"
revision: "main"

dataset:
  canonical_size:
    height: 720
    width: 1280

  num_classes: 10
  class_names:
    - pedestrian
    - rider
    - car
    - truck
    - bus
    - train
    - motorcycle
    - bicycle
    - traffic light
    - traffic sign

shards:
  train:
    pattern: "shards/train_010k_seed42/*.tar"
    subset_manifest: "manifests/train_010k_seed42.jsonl"

  val:
    pattern: "shards/val_full/*.tar"
    subset_manifest: "manifests/val_full.jsonl"

sample_keys:
  image: "jpg"
  metadata: "json"

cache:
  local_dir: ".cache/hf_datasets/bdd100k"
  download_shards: true
