defaults:
  - _self_

project:
  root: ${oc.env:PWD}

experiment:
  name: dev
  seed: 42

paths:
  data: ${project.root}/data
  runs: ${project.root}/runs
  downloads: ${paths.data}/downloads

run:
  dir: ${paths.runs}/${experiment.name}
  reports_dir: ${run.dir}/reports
  debug_dir: ${run.dir}/debug

data:
  package_name: bdd_det10_train10k_s42
  root: ${paths.data}/adp/${data.package_name}

  raw_root: ${paths.data}/raw/bdd100k/bdd100k

  images:
    train: ${data.raw_root}/images/100k/train
    val: ${data.raw_root}/images/100k/val

  labels:
    train: ${data.raw_root}/labels/train
    val: ${data.raw_root}/labels/val

  manifests_dir: ${data.root}/manifests
  metadata_dir: ${data.root}/metadata

  manifests:
    train: ${data.manifests_dir}/train.jsonl
    val: ${data.manifests_dir}/val.jsonl
    overfit16: ${data.manifests_dir}/overfit16.jsonl

subset:
  train_limit: 10000
  seed: ${experiment.seed}
  strategy: random  # random | stratified

classes:
  names:
    - pedestrian
    - rider
    - car
    - truck
    - bus
    - train
    - motorcycle
    - bicycle
    - traffic light
    - traffic sign

bdd:
  category_map:
    person: pedestrian
    rider: rider
    car: car
    truck: truck
    bus: bus
    train: train
    motor: motorcycle
    bike: bicycle
    traffic light: traffic light
    traffic sign: traffic sign

samples:
  limit: 32
  seed: ${experiment.seed}

package:
  root: ${paths.data}/packages
  split: all
  overwrite: true

hf:
  repo_id: aekn/adp-bdd
  repo_type: dataset
  revision: main
  token_env: HF_TOKEN
  files:
    train_package: packages/bdd_det10_train10k_s42.tar
    train_checksum: checksums/bdd_det10_train10k_s42.sha256
    val_package: packages/bdd_det10_val.tar
    val_checksum: checksums/bdd_det10_val.sha256

stage:
  output_dir: ${paths.data}/staged/${data.package_name}
  download_dir: ${paths.downloads}/hf/${data.package_name}
  overwrite: true

export:
  root: ${project.root}/data/exports/${data.package_name}
  copy_images: false
  overwrite: true

coco:
  output_dir: ${export.root}/coco
  category_id_base: 1

train:
  # Model
  model_name: l
  num_classes: 10
  img_size: [640, 640]
  pretrained_dir: ${project.root}/data/pretrained
  pretrained_dataset: obj2coco
  pretrained_path: ${train.pretrained_dir}/dfine_${train.model_name}_${train.pretrained_dataset}.pt

  # Data. Consumes COCO export from adp.data.export_coco.
  coco_root: ${coco.output_dir}
  train_annotations: instances_train.json
  val_annotations: instances_val.json

  # Loop
  epochs: 50
  batch_size: 8
  num_workers: 4
  device: cuda
  amp_dtype: bfloat16
  clip_grad_norm: 0.1
  seed: ${experiment.seed}

  # Optim
  base_lr: 0.00016
  backbone_lr: 0.00001
  weight_decay: 0.000125
  betas: [0.9, 0.999]
  label_smoothing: 0.0

  # Scheduler
  scheduler: onecycle       # onecycle | constant
  warmup_pct: 0.05

  # Backbone schedule
  freeze_backbone_epochs: 0

  # Augmentation
  augment: true

  # EMA
  use_ema: true
  ema_momentum: 0.9998

  # Eval
  eval_every: 1
  num_top_queries: 300

  # Robustness
  nan_recovery: true
  nan_max_consecutive: 10

  # Output
  checkpoints_dir: ${run.dir}/checkpoints
  metrics_path: ${run.dir}/metrics.jsonl

eval:
  checkpoint_path: ${train.checkpoints_dir}/best.pt
  batch_size: 8
  num_workers: 4
  device: ${train.device}
  score_threshold: 0.3
  max_images: 16
  max_predictions_per_image: 80
  draw_prediction_labels: false

hydra:
  output_subdir: null
  run:
    dir: .
